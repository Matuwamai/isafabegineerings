# Nginx site config for isafabengineering.co.ke (static site, no backend).
# Install on the VPS as /etc/nginx/sites-available/isafabengineering.co.ke
# and symlink it into /etc/nginx/sites-enabled/. See deploy/DEPLOY.md.
# Certbot adds the HTTPS (443) settings to this file automatically.

server {
    listen 80;
    listen [::]:80;
    server_name isafabengineering.co.ke www.isafabengineering.co.ke;

    root /var/www/isafabengineering.co.ke;
    index index.html;

    # Use one address: send www to the bare domain.
    if ($host = www.isafabengineering.co.ke) {
        return 301 $scheme://isafabengineering.co.ke$request_uri;
    }

    # Pages are pre-rendered as /services/index.html etc., so serve them without a trailing-slash redirect.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404/index.html;

    # Built JS/CSS have hashed filenames, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
}
